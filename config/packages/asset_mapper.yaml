framework:
    asset_mapper:
        # The paths to make available to the asset mapper.
        paths:
            - assets/
        missing_import_mode: strict
        # No CDN: modern browsers support import maps natively.
        importmap_polyfill: false
        # The CSP nonce changes on every request; keep Turbo from tracking the
        # import map by giving the attribute an empty value.
        importmap_script_attributes:
            data-turbo-track: ''

when@prod:
    framework:
        asset_mapper:
            missing_import_mode: warn
